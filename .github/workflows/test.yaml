name: Test Workflow

on:
  push:
    branches-ignore:
      - ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate parser from grammar
        run: bunx tree-sitter generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Run test suite
        run: npm test

      - name: Check highlight captures conform to standards
        run: bunx tree-sitter highlight --check --query-paths queries/highlights.scm
